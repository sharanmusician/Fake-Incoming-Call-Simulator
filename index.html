<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone</title>
    <style>
        :root {
            --surface: #1a1c1e;
            --on-surf: #e2e2e2;
            --blue: #a8c7fa;
            --red: #f28b82;
            --green: #81c995;
            --nav: #282a2d;
            --btn-bg: #303134;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Roboto', sans-serif; }
        body { margin: 0; background: #000; color: var(--on-surf); overflow: hidden; height: 100vh; width: 100vw; }

        /* Setup Screen */
        #setup { padding: 40px 24px; display: flex; flex-direction: column; height: 100%; justify-content: center; background: #000; z-index: 1000; }
        .setup-card { background: #111; padding: 30px; border-radius: 28px; border: 1px solid #333; }
        label { color: var(--blue); font-size: 11px; letter-spacing: 1px; margin-left: 5px; }
        input { width: 100%; padding: 18px; margin: 8px 0 20px; border: none; background: #252525; color: #fff; border-radius: 16px; font-size: 16px; }
        .btn-set { background: var(--blue); color: #062e6f; padding: 18px; border-radius: 100px; border: none; font-weight: bold; width: 100%; font-size: 16px; }

        .full { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 9999; flex-direction: column; }

        /* Call Screen */
        #call-ui { background: var(--surface); padding-top: 10vh; align-items: center; }
        .avatar { width: 95px; height: 95px; background: var(--btn-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; color: #8ab4f8; margin-bottom: 24px; }
        .caller-name { font-size: 34px; font-weight: 400; text-align: center; }
        .status { color: #9aa0a6; font-size: 18px; margin-top: 8px; text-align: center; }

        /* Controls Area */
        .controls { margin-top: auto; padding-bottom: 8vh; width: 100%; }
        .btn-r { width: 75px; height: 75px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; }
        .dec { background: var(--red); transform: rotate(135deg); }
        .ans { background: var(--green); }

        /* Active Grid */
        #act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; padding: 0 40px 60px; width: 100%; }
        .grid-item { text-align: center; font-size: 13px; }
        .icon-box { width: 62px; height: 62px; border: 1px solid #5f6368; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }

        /* Recents UI */
        #history-ui { background: #000; }
        .list { flex: 1; overflow-y: auto; padding: 10px 20px; }
        .item { display: flex; align-items: center; padding: 16px 0; gap: 15px; border-bottom: 1px solid #1a1a1a; }
        .missed { color: var(--red) !important; }
        .nav-bar { height: 85px; background: var(--nav); display: flex; justify-content: space-around; align-items: center; border-radius: 30px 30px 0 0; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="setup-card">
            <h1 style="font-weight:300; margin-top:0;">Aethercore</h1>
            <label>CALLER</label>
            <input type="text" id="callerName" value="Mom">
            <label>TIME</label>
            <input type="time" id="callTime">
            <button class="btn-set" onclick="startSystem()">Lock & Initialize</button>
        </div>
    </div>

    <div id="black-scr" class="full" style="background:#000;"></div>

    <div id="call-ui" class="full">
        <div class="avatar">👤</div>
        <div id="ui-name" class="caller-name">Caller</div>
        <div id="ui-status" class="status">Incoming call</div>

        <div class="controls">
            <div id="inc-row" style="display:flex; justify-content:space-evenly; width:100%">
                <button class="btn-r dec" onclick="terminate('Declined')">📞</button>
                <button class="btn-r ans" onclick="acceptCall()">📞</button>
            </div>

            <div id="act-row" style="display:none;">
                <div id="act-grid">
                    <div class="grid-item"><div class="icon-box">🔇</div>Mute</div>
                    <div class="grid-item"><div class="icon-box">⌨️</div>Keypad</div>
                    <div class="grid-item"><div class="icon-box">🔊</div>Speaker</div>
                    <div class="grid-item"><div class="icon-box">➕</div>Add</div>
                    <div class="grid-item"><div class="icon-box">⏸️</div>Hold</div>
                    <div class="grid-item"><div class="icon-box">🎙️</div>Record</div>
                </div>
                <div style="display:flex; justify-content:center">
                    <button class="btn-r dec" onclick="terminate('Ended')">📞</button>
                </div>
            </div>
        </div>
    </div>

    <div id="history-ui" class="full">
        <div style="padding:24px 24px 10px; font-size:22px;">Recents</div>
        <div class="list">
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div id="hist-mom" class="missed">Mom</div><div style="font-size:12px; color:#9aa0a6">Just now</div></div>
                <div style="font-size:22px" onclick="reCall('Mom')">📞</div>
            </div>
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div class="missed">Dad</div><div style="font-size:12px; color:#9aa0a6">2 hrs ago</div></div>
                <div style="font-size:22px" onclick="reCall('Dad')">📞</div>
            </div>
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div>Sisy</div><div style="font-size:12px; color:#9aa0a6">Yesterday</div></div>
                <div style="font-size:22px" onclick="reCall('Sisy')">📞</div>
            </div>
        </div>
        <div class="nav-bar">
            <div style="text-align:center; color:#9aa0a6; font-size:11px">⭐<br>Favorites</div>
            <div style="text-align:center; color:var(--blue); font-size:11px">🕒<br>Recents</div>
            <div style="text-align:center; color:#9aa0a6; font-size:11px">👤<br>Contacts</div>
        </div>
    </div>

    <audio id="ring" src="https://assets.mixkit.co/sfx/preview/mixkit-cell-phone-vibrating-ringing-2751.mp3" loop></audio>

    <script>
        let wl = null, vib = null, timer = null;

        async function startSystem() {
            const time = document.getElementById('callTime').value;
            if(!time) return;
            document.documentElement.requestFullscreen().catch(()=>{});
            if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');
            document.getElementById('setup').style.display='none';
            document.getElementById('black-scr').style.display='flex';
            
            const monitor = setInterval(() => {
                const now = new Date();
                const cur = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                if(cur === time) { clearInterval(monitor); triggerCall(); }
            }, 1000);
        }

        function triggerCall() {
            document.getElementById('black-scr').style.display='none';
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('ui-name').innerText = document.getElementById('callerName').value;
            document.getElementById('ring').play();
            
            // Pulse Vibration: 1.2s on, 1.5s off
            const pulse = () => { if(navigator.vibrate) navigator.vibrate([1200, 1500]); };
            pulse();
            vib = setInterval(pulse, 2700);
        }

        function acceptCall() {
            stopVibration();
            document.getElementById('ring').pause();
            document.getElementById('inc-row').style.display='none';
            document.getElementById('act-row').style.display='block';
            let sec = 0;
            timer = setInterval(() => {
                sec++;
                document.getElementById('ui-status').innerText = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
            }, 1000);
        }

        function terminate(type) {
            stopVibration();
            clearInterval(timer);
            document.getElementById('ring').pause();
            document.getElementById('ui-status').innerText = type === 'Declined' ? 'Missed call' : 'Call ended';
            
            setTimeout(() => {
                document.getElementById('call-ui').style.display='none';
                document.getElementById('history-ui').style.display='flex';
                const currentName = document.getElementById('callerName').value;
                document.getElementById('hist-mom').innerText = currentName;
                if(type !== 'Declined') document.getElementById('hist-mom').classList.remove('missed');
            }, 800);
        }

        function stopVibration() {
            clearInterval(vib);
            if(navigator.vibrate) navigator.vibrate(0);
        }

        function reCall(name) {
            document.getElementById('history-ui').style.display='none';
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('ui-name').innerText = name;
            document.getElementById('ui-status').innerText = "Calling...";
            document.getElementById('inc-row').style.display='none';
            document.getElementById('act-row').style.display='block';
            setTimeout(acceptCall, 2000); 
        }
    </script>
</body>
</html>
