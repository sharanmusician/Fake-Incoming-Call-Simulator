<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone</title>
    <style>
        :root {
            --surface: #1a1c1e;
            --on-surf: #e2e2e2;
            --blue: #a8c7fa;
            --red: #f28b82;
            --green: #81c995;
            --btn-bg: #303134;
            --btn-active: #47484b;
        }
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Roboto', sans-serif;
            /* STRICT BLOCK: No text selection, no popups, no context menus */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body { margin: 0; background: #000; color: var(--on-surf); overflow: hidden; height: 100vh; width: 100vw; }

        /* Setup Interface */
        #setup { padding: 40px 24px; display: flex; flex-direction: column; height: 100%; justify-content: center; background: #000; z-index: 1000; }
        .setup-card { background: #111; padding: 30px; border-radius: 28px; border: 1px solid #333; }
        input { width: 100%; padding: 18px; margin: 12px 0 20px; border: none; background: #252525; color: #fff; border-radius: 16px; font-size: 16px; touch-action: auto !important; -webkit-user-select: auto !important; }
        .btn-set { background: var(--blue); color: #062e6f; padding: 18px; border-radius: 100px; border: none; font-weight: bold; width: 100%; }

        .full { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 9999; flex-direction: column; }

        /* Call UI */
        #call-ui { background: var(--surface); padding-top: 10vh; align-items: center; }
        .avatar { width: 110px; height: 110px; background: #1b5099; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 55px; color: #fff; margin-bottom: 20px; }
        .caller-name { font-size: 42px; font-weight: 400; text-align: center; margin-bottom: 8px; }
        .status { color: #9aa0a6; font-size: 20px; text-align: center; }

        /* Controls */
        .controls { margin-top: auto; padding-bottom: 8vh; width: 100%; }
        .btn-r { width: 85px; height: 85px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 38px; color: #fff; }
        .btn-r:active { opacity: 0.8; transform: scale(0.95); }
        .dec { background: #f28b82; transform: rotate(135deg); }
        .ans { background: #81c995; }

        /* Interactive Grid */
        #act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; padding: 0 35px 80px; width: 100%; }
        .grid-item { text-align: center; font-size: 15px; color: #bdc1c6; }
        .icon-box { 
            width: 70px; height: 70px; border: 1px solid #5f6368; border-radius: 50%; 
            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; 
            transition: background 0.1s;
        }
        /* Visual feedback on touch */
        .icon-box:active { background: var(--btn-active); }
        .active-toggle { background: var(--blue) !important; color: #041e49 !important; border: none !important; }

        /* History */
        #history-ui { background: #000; }
        .list { flex: 1; overflow-y: auto; padding: 10px 20px; }
        .item { display: flex; align-items: center; padding: 18px 0; gap: 15px; border-bottom: 1px solid #1a1a1a; }
        .item:active { background: #111; }
        .missed { color: var(--red) !important; }
        .nav-bar { height: 90px; background: #282a2d; display: flex; justify-content: space-around; align-items: center; border-radius: 35px 35px 0 0; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="setup">
        <div class="setup-card">
            <h2 style="font-weight:300; margin:0 0 20px; color:var(--blue)">Aethercore Pro</h2>
            <input type="text" id="callerName" value="Mom">
            <input type="time" id="callTime">
            <button class="btn-set" onclick="startSystem()">Initialize Dialer</button>
        </div>
    </div>

    <div id="black-scr" class="full" style="background:#000;"></div>

    <div id="call-ui" class="full">
        <div class="avatar">👤</div>
        <div id="ui-name" class="caller-name">Caller</div>
        <div id="ui-status" class="status">Incoming call</div>

        <div class="controls">
            <div id="inc-row" style="display:flex; justify-content:space-evenly; width:100%">
                <button class="btn-r dec" onclick="terminate('Declined')">📞</button>
                <button class="btn-r ans" onclick="acceptCall()">📞</button>
            </div>

            <div id="act-row" style="display:none;">
                <div id="act-grid">
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">🔇</div>Mute</div>
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">⌨️</div>Keypad</div>
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">🔊</div>Speaker</div>
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">➕</div>Add</div>
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">⏸️</div>Hold</div>
                    <div class="grid-item" onclick="toggleBtn(this)"><div class="icon-box">🎙️</div>Record</div>
                </div>
                <div style="display:flex; justify-content:center">
                    <button class="btn-r dec" onclick="terminate('Ended')">📞</button>
                </div>
            </div>
        </div>
    </div>

    <div id="history-ui" class="full">
        <div style="padding:24px 24px 10px; font-size:24px;">Recents</div>
        <div class="list">
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div id="hist-mom" class="missed">Mom</div><div style="font-size:12px; color:#9aa0a6">Just now</div></div>
                <div style="padding:10px" onclick="reCall('Mom')">📞</div>
            </div>
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div class="missed">Dad</div><div style="font-size:12px; color:#9aa0a6">2 hrs ago</div></div>
                <div style="padding:10px" onclick="reCall('Dad')">📞</div>
            </div>
            <div class="item">
                <div class="avatar" style="width:45px; height:45px; font-size:20px; margin:0">👤</div>
                <div style="flex:1"><div>Sisy</div><div style="font-size:12px; color:#9aa0a6">Yesterday</div></div>
                <div style="padding:10px" onclick="reCall('Sisy')">📞</div>
            </div>
        </div>
        <div class="nav-bar">
            <div style="text-align:center; color:#9aa0a6; font-size:12px">⭐<br>Favorites</div>
            <div style="text-align:center; color:var(--blue); font-size:12px">🕒<br>Recents</div>
            <div style="text-align:center; color:#9aa0a6; font-size:12px">👤<br>Contacts</div>
        </div>
    </div>

    <audio id="ring" src="https://assets.mixkit.co/sfx/preview/mixkit-cell-phone-vibrating-ringing-2751.mp3" loop></audio>

    <script>
        let wl = null, vib = null, timer = null;

        // Force disable all default touch actions that trigger system popups
        window.addEventListener('touchstart', (e) => { 
            if(e.target.tagName !== 'INPUT') e.preventDefault(); 
        }, {passive: false});

        async function startSystem() {
            const time = document.getElementById('callTime').value;
            if(!time) return;
            document.documentElement.requestFullscreen().catch(()=>{});
            if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');
            document.getElementById('setup').style.display='none';
            document.getElementById('black-scr').style.display='flex';
            setInterval(() => {
                const now = new Date();
                if(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` === time) triggerCall();
            }, 1000);
        }

        function triggerCall() {
            document.getElementById('black-scr').style.display='none';
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('ui-name').innerText = document.getElementById('callerName').value;
            document.getElementById('ring').play();
            const pulse = () => { if(navigator.vibrate) navigator.vibrate([1000, 1200]); };
            pulse();
            vib = setInterval(pulse, 2200);
        }

        function acceptCall() {
            stopVib();
            document.getElementById('ring').pause();
            document.getElementById('inc-row').style.display='none';
            document.getElementById('act-row').style.display='block';
            let sec = 0;
            timer = setInterval(() => {
                sec++;
                document.getElementById('ui-status').innerText = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
            }, 1000);
        }

        function terminate(type) {
            stopVib(); clearInterval(timer);
            document.getElementById('ring').pause();
            document.getElementById('ui-status').innerText = type === 'Declined' ? 'Missed call' : 'Call ended';
            setTimeout(() => {
                document.getElementById('call-ui').style.display='none';
                document.getElementById('history-ui').style.display='flex';
                document.getElementById('hist-mom').innerText = document.getElementById('callerName').value;
                if(type !== 'Declined') document.getElementById('hist-mom').classList.remove('missed');
            }, 800);
        }

        function stopVib() { clearInterval(vib); if(navigator.vibrate) navigator.vibrate(0); }

        function toggleBtn(el) {
            const box = el.querySelector('.icon-box');
            box.classList.toggle('active-toggle');
        }

        function reCall(name) {
            document.getElementById('history-ui').style.display='none';
            document.getElementById('call-ui').style.display='flex';
            document.getElementById('ui-name').innerText = name;
            document.getElementById('ui-status').innerText = "Calling...";
            document.getElementById('inc-row').style.display='none';
            document.getElementById('act-row').style.display='block';
            setTimeout(acceptCall, 2000); 
        }
    </script>
</body>
</html>
