<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercore | Call Sim</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; background: #000; color: #fff; overflow: hidden; }
        #setup { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; }
        button { padding: 15px; border-radius: 8px; border: none; background: #2ecc71; color: #fff; font-weight: bold; cursor: pointer; }
        
        /* The Call UI - Hidden by default */
        #call-screen { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(to bottom, #2c3e50, #000); 
            display: none; flex-direction: column; align-items: center; justify-content: space-around; z-index: 9999;
        }
        .caller-info { text-align: center; margin-top: 50px; }
        .caller-info h1 { font-size: 2.5rem; margin: 0; }
        .controls { display: flex; gap: 50px; margin-bottom: 50px; }
        .btn-circle { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
        .decline { background: #ff3b30; }
        .accept { background: #4cd964; }
        
        /* Fake Sleep Overlay */
        #fake-sleep { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 5000; cursor: none; }
    </style>
</head>
<body>

    <div id="setup">
        <h2 style="font-weight: 300;">Schedule Fake Call</h2>
        <input type="text" id="callerName" placeholder="Caller Name (e.g. Mom)">
        <input type="time" id="callTime">
        <button onclick="startTimer()">Set Fake Call</button>
        <p style="font-size: 12px; color: #666;">Phone will stay awake in "Black Mode". Leave tab open.</p>
    </div>

    <div id="fake-sleep"></div>

    <div id="call-screen">
        <div class="caller-info">
            <h1 id="display-name">Unknown</h1>
            <p>Mobile</p>
        </div>
        <div class="controls">
            <div class="btn-circle decline" onclick="location.reload()">Decline</div>
            <div class="btn-circle accept" onclick="alert('Call Answered')">Accept</div>
        </div>
    </div>

    <audio id="ringtone" src="https://www.soundjay.com/phone/phone-calling-1.mp3" loop></audio>

    <script>
        let wakeLock = null;

        async function startTimer() {
            const name = document.getElementById('callerName').value || "Unknown";
            const timeVal = document.getElementById('callTime').value;
            
            if(!timeVal) return alert("Select a time");

            // Request Wake Lock to keep screen on
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) { console.error(err); }
            }

            // Enter Fake Sleep
            document.getElementById('fake-sleep').style.display = 'block';
            document.getElementById('display-name').innerText = name;

            const checkInterval = setInterval(() => {
                const now = new Date();
                const currentStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                if (currentStr === timeVal) {
                    triggerCall();
                    clearInterval(checkInterval);
                }
            }, 1000);
        }

        function triggerCall() {
            // Remove fake sleep, show call UI
            document.getElementById('fake-sleep').style.display = 'none';
            document.getElementById('call-screen').style.display = 'flex';
            
            // Audio and Vibration
            document.getElementById('ringtone').play();
            if (navigator.vibrate) {
                navigator.vibrate([1000, 500, 1000, 500, 1000]);
            }
        }
    </script>
</body>
</html>
