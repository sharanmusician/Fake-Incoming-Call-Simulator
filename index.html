<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aethercore | Premium Call Interface</title>
    <style>
        :root { --bg-dark: #0a0a0a; --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; background: #000; color: #fff; -webkit-font-smoothing: antialiased; }
        
        /* Premium Setup UI */
        #setup { padding: 40px 20px; display: flex; flex-direction: column; height: 100vh; justify-content: center; transition: opacity 0.5s; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 8px; }
        input { width: 100%; box-sizing: border-box; padding: 16px; border: 1px solid #222; background: #111; color: #fff; border-radius: 12px; font-size: 18px; outline: none; }
        .btn-start { background: #fff; color: #000; padding: 18px; border-radius: 12px; border: none; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.3s; }
        
        /* Fullscreen Overlays */
        .full-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 10000; }
        #fake-black { background: #000; cursor: none; }
        
        /* Realistic Call Interface */
        #call-ui { background: linear-gradient(to bottom, #1c1c1c, #000); flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 0 60px 0; }
        .caller-meta { text-align: center; }
        .caller-meta h1 { font-size: 36px; font-weight: 400; margin: 0; }
        .status { color: rgba(255,255,255,0.6); font-size: 18px; margin-top: 8px; }
        
        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; width: 80%; margin-bottom: 40px; }
        .action-item { text-align: center; font-size: 12px; opacity: 0.8; }
        .icon-circle { width: 65px; height: 65px; background: var(--glass); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .call-controls { width: 100%; display: flex; justify-content: space-around; align-items: center; padding-bottom: 40px; }
        .btn-call { width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: none; color: white; }
        .decline { background: #ff3b30; transform: rotate(135deg); }
        .accept { background: #4cd964; }
        .end-call { background: #ff3b30; width: 70px; height: 70px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 24px; }

        /* Summary View */
        #summary { background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .summary-card { padding: 40px; border-radius: 24px; background: #111; width: 80%; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="input-group">
            <label>Caller Name</label>
            <input type="text" id="callerName" placeholder="e.g., Board of Directors" value="Mom">
        </div>
        <div class="input-group">
            <label>Call Time</label>
            <input type="time" id="callTime">
        </div>
        <button class="btn-start" onclick="initiateSystem()">Lock & Schedule</button>
    </div>

    <div id="fake-black" class="full-overlay"></div>

    <div id="call-ui" class="full-overlay">
        <div class="caller-meta">
            <h1 id="ui-name">Unknown</h1>
            <div id="ui-status" class="status">Mobile</div>
        </div>

        <div id="active-tools" class="action-grid" style="display: none;">
            <div class="action-item"><div class="icon-circle">🔇</div>Mute</div>
            <div class="action-item"><div class="icon-circle">⌨️</div>Keypad</div>
            <div class="action-item"><div class="icon-circle">🔊</div>Speaker</div>
            <div class="action-item"><div class="icon-circle">➕</div>Add</div>
            <div class="action-item"><div class="icon-circle">🎥</div>FaceTime</div>
            <div class="action-item"><div class="icon-circle">👤</div>Contacts</div>
        </div>

        <div id="incoming-actions" class="call-controls">
            <button class="btn-call decline" onclick="endEverything()">📞</button>
            <button class="btn-call accept" onclick="acceptCall()">📞</button>
        </div>

        <div id="active-actions" style="display: none; width: 100%;">
            <div class="end-call" onclick="endEverything()">📞</div>
        </div>
    </div>

    <div id="summary" class="full-overlay">
        <div class="summary-card">
            <h2 id="summary-name">Caller</h2>
            <p id="summary-duration" style="color: #666;">00:00</p>
            <button class="btn-start" style="width: 100%; margin-top: 20px;" onclick="location.reload()">Call Again</button>
        </div>
    </div>

    <audio id="ringtone" src="https://assets.mixkit.co/sfx/preview/mixkit-cell-phone-vibrating-ringing-2751.mp3" loop></audio>

    <script>
        let wakeLock = null;
        let callStartTime = null;
        let timerInterval = null;

        async function initiateSystem() {
            const timeVal = document.getElementById('callTime').value;
            if(!timeVal) return alert("Please set a time.");

            // Request Fullscreen
            document.documentElement.requestFullscreen().catch(e => console.log(e));

            // Request Wake Lock
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }

            // Hide Setup, Show Black
            document.getElementById('setup').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('setup').style.display = 'none';
                document.getElementById('fake-black').style.display = 'block';
            }, 500);

            // Start Monitoring Time
            const monitor = setInterval(() => {
                const now = new Date();
                const current = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                if (current === timeVal) {
                    clearInterval(monitor);
                    triggerIncoming();
                }
            }, 1000);
        }

        function triggerIncoming() {
            document.getElementById('fake-black').style.display = 'none';
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('ui-name').innerText = document.getElementById('callerName').value;
            document.getElementById('ringtone').play();
            if(navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
        }

        function acceptCall() {
            document.getElementById('ringtone').pause();
            document.getElementById('incoming-actions').style.display = 'none';
            document.getElementById('active-tools').style.display = 'grid';
            document.getElementById('active-actions').style.display = 'block';
            
            callStartTime = Date.now();
            timerInterval = setInterval(updateCallDuration, 1000);
        }

        function updateCallDuration() {
            const diff = Math.floor((Date.now() - callStartTime) / 1000);
            const mins = String(Math.floor(diff / 60)).padStart(2, '0');
            const secs = String(diff % 60).padStart(2, '0');
            document.getElementById('ui-status').innerText = `${mins}:${secs}`;
        }

        function endEverything() {
            const durationText = document.getElementById('ui-status').innerText;
            clearInterval(timerInterval);
            document.getElementById('ringtone').pause();
            
            document.getElementById('call-ui').style.display = 'none';
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('summary-name').innerText = document.getElementById('callerName').value;
            document.getElementById('summary-duration').innerText = `Duration: ${durationText}`;
            
            if (document.exitFullscreen) document.exitFullscreen();
            if (wakeLock) wakeLock.release();
        }
    </script>
</body>
</html>
