<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone</title>
    <style>
        :root {
            --google-blue: #041e49;
            --google-text: #e2e2e2;
            --google-red: #f28b82;
            --google-green: #81c995;
            --surface: #1a1c1e;
            --secondary: #3c4043;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: #000; color: var(--google-text);
            font-family: 'Google Sans', Roboto, Arial, sans-serif; overflow: hidden;
        }

        /* 1. Setup Phase */
        #setup { 
            padding: 40px 24px; display: flex; flex-direction: column; height: 100%; justify-content: center;
            background: #000; z-index: 10; position: relative;
        }
        .input-card { background: #111; padding: 30px; border-radius: 28px; border: 1px solid #333; }
        input { 
            width: 100%; padding: 18px; margin: 12px 0; border: none; 
            background: #252525; color: #fff; border-radius: 16px; font-size: 16px;
        }
        .btn-set { 
            background: #a8c7fa; color: #062e6f; padding: 18px; 
            border-radius: 100px; border: none; font-weight: 500; width: 100%; margin-top: 10px;
        }

        /* 2. Fullscreen Layers */
        .full-layer { 
            position: fixed; inset: 0; width: 100%; height: 100%; 
            display: none; z-index: 9999; flex-direction: column;
        }

        /* 3. Incoming Call UI (Google Style) */
        #call-ui { background: var(--surface); padding-top: 12vh; align-items: center; }
        .caller-avatar { 
            width: 85px; height: 85px; background: #303134; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; color: #8ab4f8; margin-bottom: 24px;
        }
        .caller-name { font-size: 34px; font-weight: 400; letter-spacing: -0.5px; }
        .call-label { color: #9aa0a6; margin-top: 10px; font-size: 18px; }

        /* Incoming Controls */
        #incoming-controls { margin-top: auto; padding-bottom: 15vh; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .swipe-hint { color: #9aa0a6; font-size: 14px; margin-bottom: 40px; }
        .action-row { display: flex; width: 100%; justify-content: space-evenly; }
        
        /* Buttons */
        .btn-circle { 
            width: 76px; height: 76px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 32px;
        }
        .btn-decline { background: #f28b82; color: #3c0000; transform: rotate(135deg); }
        .btn-answer { background: #81c995; color: #003913; }
        
        /* 4. Active Call UI (The 3x2 Grid) */
        #active-ui { display: none; width: 100%; flex-direction: column; align-items: center; margin-top: auto; }
        .active-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 25px; padding: 0 40px 60px; width: 100%;
        }
        .grid-icon-wrap { text-align: center; color: #e2e2e2; font-size: 12px; }
        .icon-circle { 
            width: 64px; height: 64px; border: 1px solid #5f6368; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .end-call-btn { 
            width: 76px; height: 76px; background: #ea4335; border-radius: 50%; border: none; 
            color: white; font-size: 32px; transform: rotate(135deg); margin-bottom: 60px;
        }

        /* 5. Realistic History UI (After Decline) */
        #history-ui { background: #000; padding: 20px; }
        .history-header { border-bottom: 1px solid #333; padding: 20px 0; display: flex; align-items: center; gap: 15px; }
        .history-item { display: flex; align-items: center; padding: 20px 0; gap: 15px; }
        .missed-label { color: #f28b82; font-size: 14px; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="input-card">
            <h2 style="font-weight:400; margin-bottom:20px;">Aethercore Dialer</h2>
            <label style="font-size:12px; color:#9aa0a6">TARGET NAME</label>
            <input type="text" id="callerName" value="Dad">
            <label style="font-size:12px; color:#9aa0a6">SCHEDULE TIME</label>
            <input type="time" id="callTime">
            <button class="btn-set" onclick="startSystem()">Schedule Call</button>
        </div>
    </div>

    <div id="fake-black" class="full-layer" style="background:#000;"></div>

    <div id="call-ui" class="full-layer">
        <div class="caller-avatar">👤</div>
        <div class="caller-name" id="ui-name">Caller</div>
        <div class="call-label" id="ui-status">Incoming call</div>

        <div id="incoming-controls">
            <div class="swipe-hint">Google Verified Business</div>
            <div class="action-row">
                <button class="btn-circle btn-decline" onclick="terminateCall('Declined')">📞</button>
                <button class="btn-circle btn-answer" onclick="answerCall()">📞</button>
            </div>
        </div>

        <div id="active-ui">
            <div class="active-grid">
                <div class="grid-icon-wrap"><div class="icon-circle">🔇</div>Mute</div>
                <div class="grid-icon-wrap"><div class="icon-circle">⌨️</div>Keypad</div>
                <div class="grid-icon-wrap"><div class="icon-circle">🔊</div>Speaker</div>
                <div class="grid-icon-wrap"><div class="icon-circle">➕</div>Add call</div>
                <div class="grid-icon-wrap"><div class="icon-circle">⏸️</div>Hold</div>
                <div class="grid-icon-wrap"><div class="icon-circle">🎞️</div>Record</div>
            </div>
            <button class="end-call-btn" onclick="terminateCall('Call ended')">📞</button>
        </div>
    </div>

    <div id="history-ui" class="full-layer">
        <div class="history-header">
            <span style="font-size: 20px;">Recents</span>
        </div>
        <div class="history-item">
            <div style="width:45px; height:45px; background:#303134; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#8ab4f8">👤</div>
            <div style="flex:1">
                <div id="hist-name" style="font-size:16px;">Caller</div>
                <div class="missed-label" id="hist-status">Missed</div>
            </div>
            <div style="color:#9aa0a6; font-size:12px;">Just now</div>
        </div>
        <button class="btn-set" style="margin-top:auto" onclick="location.reload()">Back to Home</button>
    </div>

    <audio id="ring" src="https://assets.mixkit.co/sfx/preview/mixkit-cell-phone-vibrating-ringing-2751.mp3" loop></audio>

    <script>
        let wakeLock = null;
        let timer = null;
        let startTime = null;

        async function startSystem() {
            const t = document.getElementById('callTime').value;
            if(!t) return alert("Select a time first");

            // Fullscreen & Wake
            document.documentElement.requestFullscreen().catch(() => {});
            if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');

            document.getElementById('setup').style.display = 'none';
            document.getElementById('fake-black').style.display = 'flex';

            const monitor = setInterval(() => {
                const now = new Date();
                const cur = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                if(cur === t) {
                    clearInterval(monitor);
                    showIncoming();
                }
            }, 1000);
        }

        function showIncoming() {
            document.getElementById('fake-black').style.display = 'none';
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('ui-name').innerText = document.getElementById('callerName').value;
            document.getElementById('ring').play();
            if(navigator.vibrate) navigator.vibrate([800, 400, 800]);
        }

        function answerCall() {
            document.getElementById('ring').pause();
            document.getElementById('incoming-controls').style.display = 'none';
            document.getElementById('active-ui').style.display = 'flex';
            
            startTime = Date.now();
            timer = setInterval(() => {
                const sec = Math.floor((Date.now() - startTime)/1000);
                document.getElementById('ui-status').innerText = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
            }, 1000);
        }

        function terminateCall(statusType) {
            document.getElementById('ring').pause();
            clearInterval(timer);
            
            // Brief "Call Ended" feedback
            document.getElementById('ui-status').innerText = statusType;
            document.getElementById('active-ui').style.opacity = '0.3';
            
            setTimeout(() => {
                document.getElementById('call-ui').style.display = 'none';
                document.getElementById('history-ui').style.display = 'flex';
                document.getElementById('hist-name').innerText = document.getElementById('callerName').value;
                document.getElementById('hist-status').innerText = (statusType === 'Declined') ? 'Missed' : 'Outgoing • ' + document.getElementById('ui-status').innerText;
            }, 800);

            if(wakeLock) wakeLock.release();
        }
    </script>
</body>
</html>
