<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone</title>
    <style>
        :root {
            --google-red: #ea4335;
            --google-green: #34a853;
            --dark-surface: #1a1c1e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: #000; color: #e2e2e2;
            font-family: 'Roboto', sans-serif; overflow: hidden;
        }

        /* Setup UI */
        #setup { 
            padding: 40px 24px; display: flex; flex-direction: column; height: 100%; justify-content: center;
            background: #000;
        }
        .input-card { background: #111; padding: 24px; border-radius: 28px; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 16px; margin: 10px 0; border: none; 
            background: #252525; color: #fff; border-radius: 12px; font-size: 16px;
        }
        .btn-prime { 
            background: #d2e3fc; color: #041e49; padding: 18px; 
            border-radius: 100px; border: none; font-weight: 600; width: 100%;
        }

        /* Fullscreen Overlays */
        .full-layer { 
            position: fixed; inset: 0; width: 100%; height: 100%; 
            display: none; z-index: 9999; flex-direction: column;
        }

        /* Google Call Style */
        #call-ui { background: var(--dark-surface); padding-top: 15vh; }
        .avatar { 
            width: 90px; height: 90px; background: #3c4043; border-radius: 50%; 
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #8ab4f8;
        }
        .caller-name { font-size: 32px; text-align: center; font-weight: 400; }
        .call-status { text-align: center; color: #9aa0a6; margin-top: 8px; font-size: 16px; }

        /* Controls Area */
        .controls-container { margin-top: auto; padding-bottom: 60px; width: 100%; }
        
        /* Incoming Buttons */
        #incoming-btns { display: flex; justify-content: space-around; width: 100%; padding: 0 40px; }
        .circle-btn { 
            width: 72px; height: 72px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        .ans { background: var(--google-green); color: white; }
        .dec { background: var(--google-red); color: white; transform: rotate(135deg); }

        /* Active Grid */
        #active-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 20px; padding: 0 30px 40px;
        }
        .grid-item { text-align: center; font-size: 13px; color: #bdc1c6; }
        .icon-box { 
            width: 56px; height: 56px; border: 1px solid #5f6368; border-radius: 50%; 
            margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        .end-btn-container { display: flex; justify-content: center; padding-bottom: 40px; }
        .end-btn { width: 72px; height: 72px; background: var(--google-red); border-radius: 50%; border: none; color: white; font-size: 30px; transform: rotate(135deg); }

        /* Summary Overlay */
        #summary { background: #000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="setup">
        <div class="input-card">
            <h2 style="margin-top:0">Aethercore Call</h2>
            <input type="text" id="callerName" placeholder="Name" value="Dad">
            <input type="time" id="callTime">
        </div>
        <button class="btn-prime" onclick="init()">Schedule & Lock</button>
    </div>

    <div id="fake-black" class="full-layer" style="background:#000;"></div>

    <div id="call-ui" class="full-layer">
        <div class="avatar">👤</div>
        <div class="caller-name" id="ui-name">Name</div>
        <div class="call-status" id="ui-status">Calling...</div>

        <div class="controls-container">
            <div id="incoming-btns">
                <button class="circle-btn dec" onclick="reset()">📞</button>
                <button class="circle-btn ans" onclick="accept()">📞</button>
            </div>

            <div id="active-ui" style="display:none">
                <div id="active-grid">
                    <div class="grid-item"><div class="icon-box">🔇</div>Mute</div>
                    <div class="grid-item"><div class="icon-box">⌨️</div>Keypad</div>
                    <div class="grid-item"><div class="icon-box">🔊</div>Speaker</div>
                    <div class="grid-item"><div class="icon-box">➕</div>Add</div>
                    <div class="grid-item"><div class="icon-box">⏸️</div>Hold</div>
                    <div class="grid-item"><div class="icon-box">🛡️</div>Verified</div>
                </div>
                <div class="end-btn-container">
                    <button class="end-btn" onclick="terminate()">📞</button>
                </div>
            </div>
        </div>
    </div>

    <div id="summary" class="full-layer">
        <h1 id="sum-name">Done</h1>
        <p id="sum-dur" style="color:#9aa0a6"></p>
        <button class="btn-prime" style="width:200px; margin-top:30px" onclick="location.reload()">Return</button>
    </div>

    <audio id="ring" src="https://assets.mixkit.co/sfx/preview/mixkit-outgoing-call-signal-long-distance-2114.mp3" loop></audio>

    <script>
        let wl = null;
        let start = null;
        let iv = null;

        async function init() {
            const t = document.getElementById('callTime').value;
            if(!t) return;

            // Fullscreen & WakeLock
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');

            document.getElementById('setup').style.display = 'none';
            document.getElementById('fake-black').style.display = 'flex';

            const monitor = setInterval(() => {
                const now = new Date();
                if(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` === t) {
                    clearInterval(monitor);
                    incoming();
                }
            }, 1000);
        }

        function incoming() {
            document.getElementById('fake-black').style.display = 'none';
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('ui-name').innerText = document.getElementById('callerName').value;
            document.getElementById('ring').play();
            if(navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
        }

        function accept() {
            document.getElementById('ring').pause();
            document.getElementById('incoming-btns').style.display = 'none';
            document.getElementById('active-ui').style.display = 'block';
            start = Date.now();
            iv = setInterval(() => {
                const s = Math.floor((Date.now() - start)/1000);
                document.getElementById('ui-status').innerText = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            }, 1000);
        }

        function terminate() {
            const dur = document.getElementById('ui-status').innerText;
            clearInterval(iv);
            document.getElementById('call-ui').style.display = 'none';
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('sum-name').innerText = document.getElementById('callerName').value;
            document.getElementById('sum-dur').innerText = "Call ended • " + dur;
            if(wl) wl.release();
        }

        function reset() { location.reload(); }
    </script>
</body>
</html>
